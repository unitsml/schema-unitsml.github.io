# UnitsML 1.0
---
metadata:
  name: UnitsML 1.0
  version: '1.0'
  title: UnitsML 1.0 Schema Browser
  description: Interactive documentation for the UnitsML 1.0 XML schema.
  license: OASIS
build:
  xsd_mode: include_all
  resolution_mode: resolved
  serialization_format: marshal
files:
- "../schemas/unitsml/unitsml-v1.0.xsd"
schema_location_mappings:
- from: "http://www.w3.org/2009/01/xml.xsd"
  to: "../schemas-external/xml.xsd"
namespace_mappings:
- prefix: xs
  uri: http://www.w3.org/2001/XMLSchema
- prefix: unitsml
  uri: https://schema.unitsml.org/unitsml/1.0
appearance:
  logos:
    long:
      light:
        path: "logo-unitsml.svg"
      dark:
        path: "logo-unitsml.svg"
    lutaml_logo:
      light:
        url: https://raw.githubusercontent.com/lutaml/branding/main/svg/lutaml-logo_logo-full-light.svg
      dark:
        url: https://raw.githubusercontent.com/lutaml/branding/main/svg/lutaml-logo_logo-full-dark.svg
  colors:
    primary: "#2d2c69"
    primary_light: "#57a0fe"
    primary_dark: "#1a1950"
    accent: "#30dfc0"
    background_primary: "#ffffff"
    background_secondary: "#f8fafc"
