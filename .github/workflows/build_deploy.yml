name: build_deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update submodules
        run: make update-init update-modules

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build lutaml-xsd frontend
        run: cd "$(bundle show lutaml-xsd)/frontend" && npm install && npm run build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          echo "=== Debug: test v1.0 parse ==="
          bundle exec ruby -e '
            require "lutaml/xsd"
            repo = Lutaml::Xsd::SchemaRepository.from_yaml_file("configs/unitsml-v1.0.yml")
            puts "Files: #{repo.files}"
            mappings = repo.schema_location_mappings || []
            puts "Mappings count: #{mappings.size}"
            mappings.each { |m| puts "  #{m.from} => #{m.to}" }
            repo.files.each do |f|
              puts "File exists? #{f}: #{File.exist?(f)}"
              puts "File size: #{File.size(f)}" if File.exist?(f)
            end
            repo.parse
            schemas = repo.instance_variable_get(:@parsed_schemas)
            puts "Parsed schemas count: #{schemas.size}"
            schemas.each do |path, schema|
              puts "  #{File.basename(path)}: #{schema.element.size} elements, #{schema.complex_type.size} complex types, #{schema.simple_type.size} simple types"
            end
            # Also try direct parse
            puts "=== Direct parse test ==="
            begin
              content = File.read(repo.files.first)
              puts "Read #{content.size} bytes"
              parsed = Lutaml::Xml::Schema::Xsd.parse(content, location: File.dirname(repo.files.first), schema_mappings: mappings.map(&:to_glob_format))
              puts "Direct parse: #{parsed.element.size} elements, #{parsed.complex_type.size} complex types"
            rescue => e
              puts "Direct parse error: #{e.class}: #{e.message}"
              puts e.backtrace.first(5).join("\n")
            end
          '
          echo "=== Building ==="
          make all

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
